<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Umpqua Valley Lamb Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#3B5E27; --forest-deep:#2C4A1C; --linen:#F1EFE3; --paper:#FBFAF4; --field:#E8EAE0;
  --wool:#DDD9C9; --wool-dark:#8C8672; --barn:#7A3327; --ink:#23261E; --ink-soft:#5A5C50;
  --ok:#E3EBD7; --warn:#F6E7C4; --bad:#F3DAD4; --line:#D6D2C1;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Work Sans", "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --forest:#8DB36F; --forest-deep:#A9CB8E; --linen:#1D2019; --paper:#252920; --field:#2C3126;
  --wool:#3A3F33; --wool-dark:#A39E8A; --barn:#E0907F; --ink:#ECEBE2; --ink-soft:#B9B7AA;
  --ok:#2F3E25; --warn:#453B20; --bad:#4A2A24; --line:#3E4436; } }
:root[data-theme="dark"]{
  --forest:#8DB36F; --forest-deep:#A9CB8E; --linen:#1D2019; --paper:#252920; --field:#2C3126;
  --wool:#3A3F33; --wool-dark:#A39E8A; --barn:#E0907F; --ink:#ECEBE2; --ink-soft:#B9B7AA;
  --ok:#2F3E25; --warn:#453B20; --bad:#4A2A24; --line:#3E4436; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--linen);color:var(--ink);font:.9375rem/1.5 var(--body);-webkit-text-size-adjust:100%}
html.large{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:650;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.25rem} h2{font-size:1.6rem} h3{font-size:1.1rem}
:focus-visible{outline:3px solid var(--forest);outline-offset:2px}
.muted{color:var(--ink-soft)} .small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--forest);color:#F4F2E6;
  display:flex;align-items:center;gap:1rem;padding:.6rem 1rem}
:root[data-theme="dark"] header.top, header.top{}
header.top .brand{display:flex;align-items:center;gap:.6rem;min-width:0}
header.top .mark{width:30px;height:30px;border-radius:50%;border:2px solid #F4F2E6;display:grid;place-items:center;font-family:var(--display);font-size:.9rem;flex:none}
header.top h1{color:#F4F2E6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{display:flex;gap:.25rem;margin-left:auto}
nav.tabs button{background:none;border:0;color:#DDE6D2;padding:.45rem .75rem;border-radius:6px;cursor:pointer;font-weight:500}
nav.tabs button[aria-current="page"]{background:#F4F2E6;color:#2C4A1C}
.sync{font-size:.75rem;color:#DDE6D2;white-space:nowrap}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#C9B98A;margin-right:.35rem;vertical-align:1px}
.sync.live::before{background:#B7E08F}

.weekbar{display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.weekbar .wk{font-family:var(--display);font-size:1.15rem;min-width:11ch;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;min-width:40px;min-height:40px;cursor:pointer;display:inline-grid;place-items:center}
main{max-width:1280px;margin:0 auto;padding:1rem 1rem 6rem}
section.view{display:none} section.view.on{display:block}

.btn{border:1px solid var(--forest);background:var(--forest);color:#F7F5EA;border-radius:8px;padding:.55rem .95rem;cursor:pointer;font-weight:600;min-height:42px}
.btn.ghost{background:transparent;color:var(--forest)}
.btn.small{min-height:34px;padding:.3rem .7rem;font-size:.85rem}
.btn.danger{border-color:var(--barn);background:transparent;color:var(--barn)}
:root[data-theme="dark"] .btn:not(.ghost):not(.danger){color:#1D2019}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.danger){color:#1D2019}}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1rem}
.grid2{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.grid2{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}

/* This week */
.count{display:flex;align-items:flex-end;gap:1.25rem;flex-wrap:wrap}
.count .big{font-family:var(--display);font-size:clamp(4rem,12vw,7rem);line-height:.85;color:var(--forest);font-weight:650}
.count .why{padding-bottom:.4rem;max-width:34ch}
.override{display:flex;gap:.5rem;align-items:center;margin-top:1rem;flex-wrap:wrap}
.override input{width:6.5rem}
input.field,select.field,textarea.field{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:.5rem .6rem;min-height:42px;width:100%}
label.lbl{display:block;font-size:.85rem;color:var(--ink-soft);margin:.6rem 0 .25rem}
.msg{margin-top:1rem;background:var(--field);border-radius:8px;padding:.75rem;display:flex;gap:.75rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bal{width:100%;border-collapse:collapse}
.bal th{text-align:left;font-weight:500;color:var(--ink-soft);font-size:.8rem;padding:.35rem .4rem;border-bottom:1px solid var(--line)}
.bal td{padding:.5rem .4rem;border-bottom:1px solid var(--line);vertical-align:middle}
.bar{height:10px;background:var(--field);border-radius:5px;position:relative;overflow:hidden;min-width:80px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--forest);border-radius:5px}
.bar.short i{background:var(--barn)}
.tag{display:inline-block;border-radius:999px;padding:.1rem .55rem;font-size:.78rem;font-weight:600;white-space:nowrap}
.tag.sets{background:var(--forest);color:#F7F5EA}
.tag.extra{background:var(--warn)} .tag.short{background:var(--bad);color:var(--barn)} .tag.even{background:var(--ok)}
.progress{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1rem}
.progress div{flex:1 1 140px;background:var(--field);border-radius:8px;padding:.6rem .75rem}
.progress b{font-family:var(--display);font-size:1.5rem;display:block}
.cut{margin:0;padding:0;list-style:none}
.cut li{padding:.5rem 0;border-bottom:1px solid var(--line)}
.cut li:last-child{border:0}

/* Orders grid */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
table.og{border-collapse:separate;border-spacing:0;min-width:100%}
table.og th,table.og td{border-bottom:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
table.og thead th{position:sticky;top:0;background:var(--field);font-size:.78rem;font-weight:600;padding:.45rem .35rem;line-height:1.2;white-space:normal;min-width:62px;vertical-align:bottom}
table.og thead th small{display:block;font-weight:400;color:var(--ink-soft)}
table.og .cust{text-align:left;position:sticky;left:0;background:var(--paper);padding:.35rem .6rem;min-width:190px;max-width:230px;z-index:1;border-right:1px solid var(--line)}
table.og thead .cust{background:var(--field);z-index:2}
table.og td input{width:100%;min-width:56px;height:40px;border:0;background:transparent;text-align:center;font-variant-numeric:tabular-nums}
table.og td input:focus{background:var(--warn)}
table.og tr.orow:hover td{background:color-mix(in srgb,var(--field) 55%,transparent)}
table.og tr.tot td{font-weight:650;background:var(--field);padding:.55rem .3rem}
table.og tr.sf td{color:var(--barn);font-style:italic;padding:.45rem .3rem}
.cname{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
.cmeta{display:flex;gap:.35rem;align-items:center;margin-top:.15rem}
select.status{border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:.78rem;padding:.1rem .25rem}
.copy{border:0;background:none;color:var(--forest);font-size:.78rem;cursor:pointer;text-decoration:underline;padding:0}
.desk-only{display:block} .mob-only{display:none}
@media (max-width:899px){.desk-only{display:none} .mob-only{display:block}}

/* Mobile order cards */
.clist{display:grid;gap:.5rem}
.ccard{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.8rem;display:flex;justify-content:space-between;gap:.75rem;align-items:center;cursor:pointer;width:100%;text-align:left}
.ccard .sum{font-size:.82rem;color:var(--ink-soft)}
.st{font-size:.75rem;font-weight:600;border-radius:999px;padding:.12rem .55rem;white-space:nowrap}
.st.ordered{background:var(--ok)} .st.none{background:var(--field)} .st.callback{background:var(--warn)} .st.todo{background:transparent;border:1px dashed var(--wool-dark);color:var(--ink-soft)}

/* Sheet (mobile editor / modals) */
.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(20,22,16,.45)}
.sheet.on{display:flex;align-items:flex-end;justify-content:center}
@media (min-width:900px){.sheet.on{align-items:center}}
.sheet .box{background:var(--paper);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.sheet .box{border-radius:14px}}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.5rem}
.step{display:flex;align-items:center;justify-content:space-between;padding:.45rem 0;border-bottom:1px solid var(--line);gap:.75rem}
.step .nm{min-width:0}
.stepper{display:flex;align-items:center;gap:.25rem;flex:none}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--field);font-size:1.3rem;cursor:pointer;line-height:1}
.stepper input{width:58px;height:44px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-variant-numeric:tabular-nums}

/* Packing */
.packhead{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:.75rem}
.pbar{height:14px;background:var(--field);border-radius:7px;overflow:hidden;margin:.5rem 0 1rem}
.pbar i{display:block;height:100%;background:var(--forest)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:.45rem .8rem;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--forest);color:#F7F5EA}
.pcust{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:.9rem;overflow:hidden}
.pcust .ph{display:flex;justify-content:space-between;gap:.5rem;align-items:center;padding:.7rem .85rem;background:var(--field)}
.pline{display:flex;align-items:center;gap:.6rem;padding:.55rem .85rem;border-top:1px solid var(--line)}
.pline .what{flex:1;min-width:0}
.pline .qty{font-family:var(--display);font-size:1.35rem;min-width:2.5ch;text-align:right}
.tick{min-width:104px;min-height:48px;border-radius:10px;border:2px solid var(--forest);background:transparent;color:var(--forest);font-weight:650;cursor:pointer}
.tick.done{background:var(--forest);color:#F7F5EA}
.tick.part{border-color:var(--barn);color:var(--barn);background:var(--bad)}
.pfoot{display:flex;gap:1rem;align-items:center;padding:.65rem .85rem;border-top:1px solid var(--line);flex-wrap:wrap}
.pfoot .stepper button{width:40px;height:40px}
.pfoot .stepper input{width:52px;height:40px}
.by{font-size:.78rem;color:var(--ink-soft)}

/* Half & whole */
.hwlist{display:grid;gap:.6rem}
.hwcard{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.85rem;display:grid;gap:.35rem}
.coach .part{border-top:1px solid var(--line);padding:.6rem 0}
.coach .slot{display:flex;gap:.5rem;align-items:center;margin:.3rem 0}
.coach .slot span{min-width:5.5rem;font-size:.85rem;color:var(--ink-soft)}
.avail{font-size:.75rem;white-space:nowrap}
.avail.ok{color:var(--forest)} .avail.no{color:var(--barn)}
.sizes{display:flex;gap:.5rem}
.sizes button{flex:1;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600}
.sizes button[aria-pressed="true"]{border-color:var(--forest);background:var(--ok);color:var(--forest-deep)}

/* Tables generic */
table.simple{width:100%;border-collapse:collapse}
table.simple th{text-align:left;font-weight:500;font-size:.8rem;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:.35rem}
table.simple td{border-bottom:1px solid var(--line);padding:.45rem .35rem}
.negative{color:var(--barn);font-weight:650}
.unconfirmed{background:var(--warn);border-radius:4px;padding:0 .25rem}
.note{background:var(--field);border-left:4px solid var(--forest);padding:.6rem .8rem;border-radius:4px;margin:0 0 1rem}
.empty{padding:2rem 1rem;text-align:center;color:var(--ink-soft)}
.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* CRM */
.pin{background:var(--warn);border-radius:8px;padding:.6rem .75rem;margin:.5rem 0;white-space:pre-wrap}
.pin.empty{background:var(--field);color:var(--ink-soft)}
.cname-btn{border:0;background:none;padding:0;font-weight:600;cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.cname-btn:hover{text-decoration:underline}
.cpin{display:block;font-size:.72rem;color:var(--ink-soft);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.timeline{list-style:none;margin:.5rem 0 0;padding:0}
.timeline li{border-left:2px solid var(--line);padding:.1rem 0 .8rem .85rem;position:relative}
.timeline li::before{content:"";position:absolute;left:-6px;top:.45rem;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--wool-dark)}
.timeline li.t-call::before,.timeline li.t-visit::before,.timeline li.t-email::before{border-color:var(--forest);background:var(--forest)}
.timeline li.t-order::before{border-color:var(--wool-dark)}
.timeline .when{font-size:.78rem;color:var(--ink-soft)}
.fu{display:inline-block;font-size:.75rem;border-radius:999px;padding:.05rem .5rem;background:var(--warn);margin-left:.35rem}
.fu.done{background:var(--ok);text-decoration:line-through}
.contacts{display:grid;gap:.4rem;margin:.4rem 0}
.contacts div{display:flex;gap:.5rem;flex-wrap:wrap;align-items:baseline}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;padding:.5rem 0;border-bottom:1px solid var(--line)}
@media (min-width:600px){.crow{grid-template-columns:1.2fr 1fr 1fr 1.3fr auto}}
.lastc{font-size:.82rem;color:var(--ink-soft);margin:.25rem 0}
.fulist{list-style:none;margin:0;padding:0}
.fulist li{display:flex;gap:.75rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
.fulist li:last-child{border:0}

/* Welcome / role */
.welcome{max-width:520px;margin:2rem auto;text-align:center}
.welcome .choices{display:grid;gap:.75rem;margin-top:1.25rem}
.bigchoice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:1.1rem 1.2rem;cursor:pointer;font-size:1.15rem}
.bigchoice b{display:block;font-family:var(--display);font-size:1.4rem;color:var(--forest)}
.bigchoice:hover,.bigchoice:focus-visible{border-color:var(--forest)}
#roleBtn{background:none;border:1px solid #DDE6D2;color:#F4F2E6;border-radius:6px;padding:.3rem .6rem;cursor:pointer;font-size:.8rem;white-space:nowrap}

/* Calls */
.callcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1.1rem;max-width:640px;margin:0 auto}
.callcard h2{font-size:1.9rem}
.bigbtn{display:block;width:100%;min-height:60px;border-radius:12px;font-size:1.15rem;font-weight:650;cursor:pointer;border:2px solid var(--forest);background:var(--forest);color:#F7F5EA;margin-top:.6rem}
.bigbtn.alt{background:var(--paper);color:var(--forest)}
.bigbtn.quiet{border-color:var(--line);background:var(--field);color:var(--ink)}
.bigbtn.tel{background:var(--paper);color:var(--forest);text-align:center;text-decoration:none;line-height:56px}
.readback{background:var(--field);border-radius:10px;padding:.75rem 1rem;margin:.75rem 0;font-size:1.15rem}
.readback div{padding:.15rem 0;display:flex;gap:.75rem}
.readback .q{font-family:var(--display);min-width:3ch;text-align:right;font-weight:650}
.queue{max-width:640px;margin:1.25rem auto 0}
.queue button{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:.7rem .25rem;cursor:pointer;text-align:left;font-size:1rem}
.queue button[aria-current="true"]{font-weight:650;color:var(--forest)}
.callprog{max-width:640px;margin:0 auto .75rem;display:flex;justify-content:space-between;align-items:baseline}
.more-cuts{border:0;background:none;color:var(--forest);text-decoration:underline;cursor:pointer;padding:.6rem 0;font-size:1rem}

/* Packing rows: whole row is the button */
.prow{display:flex;align-items:center;gap:.8rem;width:100%;border:0;border-top:1px solid var(--line);background:var(--paper);padding:.8rem .9rem;cursor:pointer;text-align:left;min-height:68px}
.prow .box{width:38px;height:38px;border-radius:9px;border:3px solid var(--forest);flex:none;display:grid;place-items:center;font-size:1.4rem;font-weight:700;color:#F7F5EA}
.prow.done{background:var(--ok)} .prow.done .box{background:var(--forest)}
.prow.part{background:var(--bad)} .prow.part .box{border-color:var(--barn);background:var(--barn)}
.prow .what{flex:1;min-width:0;font-size:1.1rem}
.prow .qty{font-family:var(--display);font-size:1.7rem;min-width:2.5ch;text-align:right}
.fewer{border:0;background:none;color:var(--barn);text-decoration:underline;cursor:pointer;font-size:.9rem;padding:.2rem .9rem .7rem;display:block}
.alldone{background:var(--forest);color:#F7F5EA;padding:.5rem .9rem;font-weight:650}
#printArea{display:none}
@media print{ body.printing > *:not(#printArea){display:none!important} body.printing #printArea{display:block}
  #printArea h1{font-size:18pt} #printArea table{width:100%;border-collapse:collapse;margin-bottom:14pt;page-break-inside:avoid}
  #printArea td,#printArea th{border:1px solid #999;padding:6pt;font-size:12pt;text-align:left} #printArea .ck{width:24pt}}

@media (max-width:899px){.sync{font-size:0}}
/* Cut sheet */
.cutstat{border-radius:8px;padding:.55rem .75rem;margin:.5rem 0;font-weight:500}
.cutstat.notsent{background:var(--field)} .cutstat.sent{background:var(--ok)} .cutstat.changed{background:var(--bad);color:var(--barn)}
pre.cutpre{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.8rem;white-space:pre-wrap;font:.88rem/1.45 var(--body);margin:.5rem 0;max-height:46vh;overflow:auto}
.xrow{display:flex;gap:.6rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.xrow span{flex:1 1 160px}
.xrow select{flex:1 1 180px}
#printArea pre{font:12pt/1.5 Arial, sans-serif;white-space:pre-wrap}

/* Cut sheet builder */
.setcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:1rem 0;overflow:hidden}
.setcard.bad{border-color:var(--barn)}
.sethead{display:grid;grid-template-columns:minmax(0,2fr) 5.5rem minmax(0,1fr) auto;gap:.5rem;padding:.75rem;background:var(--field);align-items:end}
@media (max-width:640px){.sethead{grid-template-columns:1fr 1fr}.sethead .sname{grid-column:1/-1}}
.sethead label{font-size:.75rem;color:var(--ink-soft);display:block}
.setbody{padding:.5rem .75rem .75rem}
.lrow{display:grid;grid-template-columns:4.2rem minmax(0,1fr) minmax(0,.7fr) auto;gap:.4rem;align-items:center;padding:.3rem 0;border-bottom:1px dashed var(--line)}
@media (max-width:640px){.lrow{grid-template-columns:4rem minmax(0,1fr) auto}.lrow .side{grid-column:1/-1}}
.lrow input,.lrow select{min-height:40px}
.lrow.hl-y{background:#F7EE9A55}.lrow.hl-b{background:#9CC9EE55}.lrow.hl-g{background:#7FC08A55}
.lopts{display:flex;gap:.3rem;align-items:center}
.hlbtn{flex:none;width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:.7rem}
.hlbtn.y{background:#F2E36B}.hlbtn.b{background:#8EC0EA}.hlbtn.g{background:#73B87E}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0 0}
.chip{font-size:.78rem;border-radius:999px;padding:.12rem .55rem;background:var(--ok)}
.chip.bad{background:var(--bad);color:var(--barn);font-weight:650}

.cs-top{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start}
.cs-meta{font:600 12px Arial,sans-serif;line-height:2}
.cs-ban{font:italic 700 16px Georgia,serif;padding:3px 8px}
.cs-ban.c0{background:#E07FB5}.cs-ban.c1{background:#7DB8EC}.cs-ban.c2{background:#F2EA62}
.cs-std{font:600 13px Arial,sans-serif;margin:12px 0}
.cs-sizes{font:600 13px Georgia,serif;margin:4px 0 10px auto;width:300px}
.cs-set{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:18px 0}
.cs-left{font:600 11px Arial,sans-serif}

.cs-hl{font:italic 700 14px Arial,sans-serif;background:#F2EA62;padding:2px 6px}
.cs-line{display:grid;grid-template-columns:52px 1fr 220px;font-size:14px;border-bottom:1px solid #999;padding:2px 0}
.cs-line .q{text-align:center;font-weight:700;border-bottom:1px solid #111}
.cs-line .sd{font-weight:700;font-size:13px}
.cs-line.y{background:#F2EA62}.cs-line.b{background:#7DB8EC}.cs-line.g{background:#73B87E}
.cs-foot{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-top:16px;font:600 12px Arial,sans-serif}
.cs-notes{background:#D9567F;min-height:40px;padding:4px 8px;font:600 13px Georgia,serif;color:#111}
@media print{#printArea .cs{border:0;padding:0}#printArea .cs-inner{min-width:0}#printArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* Mobile bottom nav */

  nav.tabs{display:none}
  nav.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.bottom button{flex:1;border:0;background:none;padding:.55rem .2rem .6rem;font-size:.72rem;color:var(--ink-soft);cursor:pointer;min-height:56px}

  header.top,nav,.weekbar .iconbtn,.noprint{display:none!important}
  body{background:#fff} main{padding:0} .panel,.pcust{border-color:#999}
}

<body>
<header class="top">
  <div class="brand"><div class="mark" aria-hidden="true">UV</div><h1>Umpqua Valley Lamb</h1></div>
  <nav class="tabs" aria-label="Sections">
    <button data-go="calls">Calls</button>
    <button data-go="week">This week</button>
    <button data-go="orders">Orders</button>
    <button data-go="pack">Packing</button>
    <button data-go="hw">Half &amp; whole</button>
    <button data-go="freezer">Freezer</button>
    <button data-go="customers">Customers</button>
    <button data-go="cutsheet">Cut sheet</button>

<nav class="bottom" aria-label="Sections">
  <button data-go="calls"><b>&#9742;</b>Calls</button>
  <button data-go="week"><b>&#9673;</b>Week</button>
  <button data-go="orders"><b>&#9998;</b>Orders</button>
  <button data-go="pack"><b>&#10003;</b>Packing</button>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="box" id="sheetBox"></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="printArea"></div>

<script>
(function(){
"use strict";
/* ---------- tiny helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const fmt = v => { const r = Math.round(v*10)/10; return (Math.abs(r - Math.round(r)) < 1e-9 ? Math.round(r) : r).toString(); };
const toast = (msg, undo) => { const t = $("#toast"); t.innerHTML = ""; const sp = document.createElement("span"); sp.textContent = msg; t.appendChild(sp);
  if (undo){ const b = document.createElement("button"); b.textContent = "Undo"; b.onclick = () => { t.classList.remove("on"); undo(); }; t.appendChild(b); }
  t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("on"), undo ? 6000 : 1800); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const isoD = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const monday = d => { const x = new Date(d); const k = (x.getDay()+6)%7; x.setDate(x.getDate()-k); return x; };
const niceD = s => { if(!s) return ""; const d = parseD(s); return MON[d.getMonth()]+" "+d.getDate(); };
const longD = s => { if(!s) return ""; const d = parseD(s); return DAYS[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate(); };

/* ---------- storage: shared db when available, this browser otherwise ---------- */
const COLLS = ["config","customers","weeks","orders","packing","halfwhole","freezer","touches"];
const S = {}; COLLS.forEach(c => S[c] = {});
const Store = {
  mode: "connecting", db: null, queues: {},
  async init(){
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e){ db = null; }
    if (db){
      this.db = db; this.mode = "live";
      COLLS.forEach(c => db.collection(c).onSnapshot(
        snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S[c] = m; scheduleRender(); },
        err => { if (err && err.code === "revoked"){ setSync("Read only"); } }
      ));
      setSync("Live, shared", true);
    } else {
      this.mode = "local";
      COLLS.forEach(c => { try { S[c] = JSON.parse(localStorage.getItem("uvl:"+c) || "{}"); } catch(e){ S[c] = {}; } });
      setSync("This device only");
      scheduleRender();
    }
  },
  _saveLocal(c){ try { localStorage.setItem("uvl:"+c, JSON.stringify(S[c])); } catch(e){} },
  /* one write at a time per document; later writes to the same doc replace queued ones */
  set(c, id, data){
    S[c] = Object.assign({}, S[c], {[id]: data}); scheduleRender();
    if (this.mode !== "live"){ this._saveLocal(c); return Promise.resolve(); }
    const key = c+"/"+id; const q = this.queues[key] || (this.queues[key] = {busy:false, next:null});
    q.next = data;
    const run = async () => {
      if (q.busy || !q.next) return; q.busy = true; const d = q.next; q.next = null;
      try { await this.db.collection(c).doc(id).set(d); }
      catch(e){ if (e && e.code === "unavailable"){ await new Promise(r=>setTimeout(r, 400+Math.random()*600)); try { await this.db.collection(c).doc(id).set(d); } catch(e2){ toast("Couldn't save. Check your connection."); } }
                else if (e && e.code === "quota_exceeded"){ toast("The demo database is full. Delete some freezer log entries."); }
                else if (e && e.code === "invalid_argument"){ toast("You have view-only access, so changes aren't saved."); }
                else toast("Couldn't save that change."); }
      q.busy = false; if (q.next) run();
    };
    run(); return Promise.resolve();
  },
  remove(c, id){
    const m = Object.assign({}, S[c]); delete m[id]; S[c] = m; scheduleRender();
    if (this.mode !== "live"){ this._saveLocal(c); return; }
    this.db.collection(c).doc(id).delete().catch(()=>toast("Couldn't delete that."));
  }
};
function setSync(t, live){ const el = $("#sync"); el.textContent = t; el.classList.toggle("live", !!live); }

/* who is using the page (for "packed by") */
let USER = null, MYID = null, NAMES = {};
(async () => {
  try { USER = window.claude && window.claude.use ? await window.claude.use("user") : null; if (USER){ MYID = await USER.id(); scheduleRender(); } } catch(e){}
})();
async function resolveNames(ids){
  if (!USER || !ids.length) return;
  try { const ps = await USER.profiles(ids); let changed = false;
    ids.forEach(id => { const nm = (ps[id] && ps[id].name) || ""; if (NAMES[id] !== nm){ NAMES[id] = nm; changed = true; } });
    if (changed) scheduleRender();
  } catch(e){}
}

/* ---------- derived data ---------- */
const cfg = () => S.config.setup || null;
const parts = () => (cfg() && cfg().parts) || [];
const products = () => (cfg() && cfg().products) || [];
const prodById = id => products().find(p => p.id === id);
const partById = id => parts().find(p => p.id === id);
const customers = () => Object.entries(S.customers).map(([id,c]) => Object.assign({id}, c)).sort((a,b)=>a.name.localeCompare(b.name));
const activeCustomers = () => customers().filter(c => c.active !== false);
const orderId = (wk, cid) => wk+"_"+cid;
const touchesFor = cid => Object.entries(S.touches).map(([id,t]) => Object.assign({id}, t)).filter(t => t.customerId === cid).sort((a,b) => (b.at||0) - (a.at||0));
const lastTouch = cid => touchesFor(cid)[0] || null;
const contactsOf = c => (c && c.contacts) || (c && (c.contact || c.phone) ? [{name: c.contact || "", role: "", phone: c.phone || "", email: ""}] : []);
const KIND = {call:"Call", email:"Email", visit:"Visit", note:"Note"};
const ago = at => { if (!at) return ""; const d = Math.floor((Date.now() - at) / 86400000); return d <= 0 ? "today" : d === 1 ? "yesterday" : d < 14 ? d + " days ago" : new Date(at).toLocaleDateString([], {month:"short", day:"numeric"}); };
let WEEK = null;

function weekOrders(wk){ return Object.entries(S.orders).filter(([,o]) => o.weekId === wk).map(([id,o]) => Object.assign({id}, o)); }
function orderLines(o){ return (o && o.lines) || {}; }

function freezerOnHand(){
  const oh = {}; products().forEach(p => oh[p.id] = 0);
  Object.values(S.freezer).forEach(e => { oh[e.pid] = (oh[e.pid]||0) + n(e.qty); });
  Object.values(S.halfwhole).forEach(h => { if (h.status === "filled"){ const l = hwLines(h); for (const k in l) oh[k] = (oh[k]||0) - l[k]; } });
  return oh;
}
function hwLines(h){
  const lines = {};
  const frac = h.size === "whole" ? 1 : 0.5;
  const ch = h.choices || {};
  for (const pid of Object.values(ch).flat()){ if (pid) lines[pid] = (lines[pid]||0) + 1; }
  // trim becomes ground lamb automatically
  parts().filter(p => !p.check).forEach(pt => {
    const prod = products().find(pr => pr.uses.length === 1 && pr.uses[0].part === pt.id);
    if (prod) lines[prod.id] = (lines[prod.id]||0) + pt.yield * frac / prod.uses[0].qty;
  });
  return lines;
}
function hwNeeds(){
  const need = {}, onHand = freezerOnHand(), short = {};
  Object.values(S.halfwhole).forEach(h => { if (h.status === "pending"){ const l = hwLines(h); for (const k in l) need[k] = (need[k]||0) + l[k]; } });
  products().forEach(p => { short[p.id] = Math.max(0, (need[p.id]||0) - (onHand[p.id]||0)); });
  return {need, onHand, short};
}

function calcWeek(wk){
  const totals = {}; products().forEach(p => totals[p.id] = 0);
  weekOrders(wk).forEach(o => { const l = orderLines(o); for (const k in l) totals[k] = (totals[k]||0) + n(l[k]); });
  const {short} = hwNeeds();
  const withShort = Object.assign({}, totals); for (const k in short) withShort[k] = (withShort[k]||0) + short[k];
  const need = {}; parts().forEach(p => need[p.id] = 0);
  products().forEach(p => (p.uses||[]).forEach(u => { need[u.part] = (need[u.part]||0) + (withShort[p.id]||0) * n(u.qty); }));
  const rows = parts().map(p => {
    const nd = need[p.id] || 0;
    return {part: p, need: nd, lambs: nd > 0 && p.yield > 0 ? Math.ceil(nd / p.yield - 1e-9) : 0};
  });
  const rec = rows.reduce((m,r) => Math.max(m, r.lambs), 0);
  const driver = rows.find(r => r.lambs === rec && rec > 0);
  const w = S.weeks[wk] || {};
  const final = w.lambOverride != null && w.lambOverride !== "" ? n(w.lambOverride) : rec;
  rows.forEach(r => { r.supply = final * r.part.yield; r.left = r.supply - r.need; });
  return {totals, short, withShort, rows, rec, driver, final, w};
}

/* ---------- routing ---------- */
let VIEW = "week";
const ROLES = {
  orders: {label: "I take orders", sub: "Calls, orders, customers, and half and whole lambs", views: ["calls","week","orders","cutsheet","hw","customers","freezer","setup"], home: "calls"},
  pack: {label: "I pack orders", sub: "Just the packing list, big and simple", views: ["pack"], home: "pack"},
  all: {label: "I do everything", sub: "Every screen", views: ["calls","week","orders","cutsheet","pack","hw","freezer","customers","setup"], home: "week"}
};
let ROLE = null; try { ROLE = localStorage.getItem("uvl:role"); } catch(e){}
try { if (localStorage.getItem("uvl:large") === "1") document.documentElement.classList.add("large"); } catch(e){}
function applyRole(){
  const r = ROLES[ROLE] || ROLES.all;
  document.querySelectorAll("[data-go]").forEach(b => { const v = b.dataset.go; b.style.display = (v === "more" ? ROLE !== "pack" : r.views.includes(v)) ? "" : "none"; });
  document.querySelector("nav.bottom").classList.toggle("hide-for-pack", ROLE === "pack");
  if (ROLE === "pack") document.querySelector("nav.bottom").style.display = "none"; else document.querySelector("nav.bottom").style.display = "";
}
function setRole(r){ ROLE = r; try { localStorage.setItem("uvl:role", r); } catch(e){} applyRole(); go(ROLES[r].home); }
$("#roleBtn").onclick = openSettings;
function openSettings(){
  const large = document.documentElement.classList.contains("large");
  openSheet(`<div class="hd"><h3>Settings for this device</h3><button class="iconbtn" data-close aria-label="Close">&#10005;</button></div>
    <p class="muted">Who uses this ${matchMedia("(max-width:899px)").matches ? "phone" : "computer"}? It only shows the screens that person needs.</p>
    <div class="welcome" style="margin:0;text-align:left"><div class="choices">${Object.entries(ROLES).map(([k,r]) => `<button class="bigchoice" data-role="${k}" style="${ROLE===k ? "border-color:var(--forest)" : ""}"><b>${r.label}</b>${r.sub}</button>`).join("")}</div></div>
    <label class="row" style="margin-top:1rem;font-size:1.05rem"><input type="checkbox" id="lgt" ${large ? "checked" : ""} style="width:24px;height:24px"> Larger text</label>
    <div class="row" style="margin-top:1rem"><span class="spacer"></span><button class="btn" data-close>Done</button></div>`);
  $("#sheetBox").querySelectorAll("[data-role]").forEach(b => b.onclick = () => setRole(b.dataset.role));
  $("#lgt").onchange = e => { document.documentElement.classList.toggle("large", e.target.checked); try { localStorage.setItem("uvl:large", e.target.checked ? "1" : "0"); } catch(x){} };
}
function go(v){
  if (v === "more"){ openMore(); return; }
  if (!ROLE && v !== "welcome"){ v = "welcome"; }
  if (ROLE && v !== "welcome" && !(ROLES[ROLE] || ROLES.all).views.includes(v)) v = (ROLES[ROLE] || ROLES.all).home;
  VIEW = v; closeSheet();
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-"+v));
  document.querySelectorAll("[data-go]").forEach(b => { if (b.dataset.go === v || (b.dataset.go === "more" && ["freezer","customers","setup","cutsheet"].includes(v))) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $("#weekbar").style.display = ["week","orders","pack","calls","cutsheet"].includes(v) ? "" : "none";
  try { localStorage.setItem("uvl:view", v); } catch(e){}
  render(); window.scrollTo(0,0);
}
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
function openMore(){
  openSheet(`<div class="hd"><h3>More</h3><button class="iconbtn" data-close aria-label="Close">&#10005;</button></div>
    <div class="clist">
      <button class="ccard" data-go2="cutsheet"><span><b>Cut sheet</b><br><span class="sum">This week's sheet for Mohawk</span></span></button>
      <button class="ccard" data-go2="freezer"><span><b>Freezer</b><br><span class="sum">What's on hand, add or remove cuts</span></span></button>
      <button class="ccard" data-go2="customers"><span><b>Customers</b><br><span class="sum">Customer list and call days</span></span></button>
      <button class="ccard" data-go2="setup"><span><b>Setup</b><br><span class="sum">Parts per lamb and products</span></span></button>
    </div>`);
  $("#sheetBox").querySelectorAll("[data-go2]").forEach(b => b.onclick = () => go(b.dataset.go2));
}

/* week picker */
function setWeek(wk){ WEEK = wk; try { localStorage.setItem("uvl:week", wk); } catch(e){} render(); }
$("#prevWk").onclick = () => { const d = parseD(WEEK); d.setDate(d.getDate()-7); setWeek(isoD(d)); };
$("#nextWk").onclick = () => { const d = parseD(WEEK); d.setDate(d.getDate()+7); setWeek(isoD(d)); };
function pickDefaultWeek(){
  let saved = null; try { saved = localStorage.getItem("uvl:week"); } catch(e){}
  if (saved) return saved;
  const withData = [...new Set(Object.values(S.orders).map(o => o.weekId))].sort();
  return withData.length ? withData[withData.length-1] : isoD(monday(new Date()));
}

/* ---------- sheet ---------- */
function openSheet(html){ $("#sheetBox").innerHTML = html; $("#sheet").classList.add("on"); $("#sheetBox").querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheet); const f = $("#sheetBox").querySelector("input,select,button"); if (f) f.focus({preventScroll:true}); }
function closeSheet(){ $("#sheet").classList.remove("on"); SHEET = null; }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
let SHEET = null; // {type, id} for live re-render of open editors

/* ---------- render loop ---------- */
let rq = false;
function scheduleRender(){ if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }
function render(){
  if (VIEW === "welcome"){ renderWelcome(); return; }
  if (Store.mode === "connecting"){ $("#v-"+VIEW).innerHTML = `<div class="empty">Loading orders...</div>`; return; }
  if (!WEEK && (Store.mode === "local" || Object.keys(S.orders).length || Object.keys(S.config).length)) WEEK = pickDefaultWeek();
  if (!cfg()){
    $("#v-"+VIEW).innerHTML = `<div class="empty"><h3>Setup hasn't been loaded yet</h3><p>Parts per lamb and the product list need to be added before orders can be calculated.</p></div>`;
    return;
  }
  const d = parseD(WEEK), end = new Date(d); end.setDate(end.getDate()+6);
  $("#wkLabel").textContent = "Week of " + niceD(WEEK);
  const w = S.weeks[WEEK] || {};
  $("#wkSub").textContent = w.processDate ? "Processing " + longD(w.processDate) : "";
  const keep = captureFocus();
  ({welcome:renderWelcome, calls:renderCalls, cutsheet:renderCutsheet, week:renderWeek, orders:renderOrders, pack:renderPack, hw:renderHW, freezer:renderFreezer, customers:renderCustomers, setup:renderSetup})[VIEW]();
  if (SHEET && SHEET.type === "order") refreshOrderSheet();
  if (SHEET && SHEET.type === "cust") refreshCustSheet();
  if (SHEET && SHEET.type === "cut") refreshCutSheet();
  restoreFocus(keep);
}
function captureFocus(){ const a = document.activeElement; if (!a || !a.dataset || !a.dataset.k) return null; let s = null, e = null; try { s = a.selectionStart; e = a.selectionEnd; } catch(x){} return {k: a.dataset.k, s, e}; }
function restoreFocus(f){ if (!f) return; const el = document.querySelector(`[data-k="${CSS.escape(f.k)}"]`); if (el && el !== document.activeElement){ el.focus({preventScroll:true}); try { if (f.s != null) el.setSelectionRange(f.s, f.e); } catch(x){} } }

/* ---------- This week ---------- */
function renderWeek(){
  const c = calcWeek(WEEK), el = $("#v-week");
  const orders = weekOrders(WEEK);
  const act = activeCustomers();
  const responded = act.filter(cu => { const o = S.orders[orderId(WEEK, cu.id)]; return o && (o.status === "ordered" || o.status === "none"); }).length;
  const pk = packStats(WEEK);
  const unconfirmed = parts().filter(p => !p.confirmed).length;

const CS_PARTS = [["leg","Legs"],["shoulder","Shoulders"],["rack","Racks"],["loin","Short loins"],["fshank","Front shanks"],["hshank","Hind shanks"]];

  fshank: {label: "Front shank", u: {fshank:1}}, hshank: {label: "Hind shank", u: {hshank:1}}, allshank: {label: "Any shank", u: {fshank:.5, hshank:.5}},
  carcass: {label: "Whole lamb", u: {leg:2, shoulder:2, rack:2, loin:2, fshank:2, hshank:2}}, none: {label: "Nothing to count (necks, bellies, bones)", u: {}}

function linkedOrderLines(set){
  const lines = {}; (set.customers || []).forEach(cid => { const o = S.orders[orderId(WEEK, cid)]; Object.entries(orderLines(o)).forEach(([k,v]) => lines[k] = (lines[k]||0) + n(v)); });

}
function setOrderHint(set, i){

function fillSetFromOrders(c, si){

    const ex = (set.lines || []).find(l => l.kind !== "note" && l.spec === p.spec);
    if (ex) ex.qty = n(ex.qty) + lines[p.id]; else { set.lines = set.lines || []; set.lines.push({spec: p.spec, qty: lines[p.id], side: "", hl: ""}); }

}

/* ---------- Orders ---------- */
const drafts = {}; const draftTimers = {};
function getLines(oid){ return drafts[oid] || orderLines(S.orders[oid]); }
function setQty(cid, pid, val){
  const oid = orderId(WEEK, cid);
  const lines = Object.assign({}, getLines(oid));
  const v = Math.max(0, n(val)); if (v) lines[pid] = v; else delete lines[pid];
  drafts[oid] = lines;
  clearTimeout(draftTimers[oid]);
  draftTimers[oid] = setTimeout(() => flushOrder(cid), 500);
}
function flushOrder(cid, extra){
  const oid = orderId(WEEK, cid); const wk = WEEK;
  const cur = S.orders[oid] || {weekId: wk, customerId: cid, status: "todo", lines: {}, notes: ""};
  const lines = drafts[oid] || cur.lines || {};
  let status = cur.status; if (Object.keys(lines).length && (status === "todo" || status === "none" || !status)) status = "ordered";
  Store.set("orders", oid, Object.assign({}, cur, {weekId: wk, customerId: cid, lines, status}, extra || {}));
  delete drafts[oid];
}
function copyLastWeek(cid){

  if (!prev || !Object.keys(orderLines(prev)).length){ toast("No order from last week to copy"); return; }

}
function hasLastWeek(cid){ const d = parseD(WEEK); d.setDate(d.getDate()-7); const prev = S.orders[orderId(isoD(d), cid)]; return !!(prev && Object.keys(orderLines(prev)).length); }
const STATUS = {todo:"Not called", ordered:"Ordered", none:"No order", callback:"Call back"};

  list.forEach(p => { const g = p.group || "Other"; if (g !== last){ out += `<h4 style="margin:.9rem 0 .1rem;font-family:var(--display);color:var(--forest)">${esc(g)}</h4>`; last = g; } out += row(p); });
  return out;
}

function updateTotalsOnly(){ scheduleRender(); }

function openOrderSheet(cid){ SHEET = {type:"order", id: cid}; openSheet(`<div id="osheet"></div>`); refreshOrderSheet(); }

/* ---------- read-back ---------- */
function readback(lines){
  const items = products().filter(p => n(lines[p.id]) > 0);
  if (!items.length) return `<div class="readback muted">Nothing ordered yet.</div>`;
  return `<div class="readback">${items.map(p => `<div><span class="q num">${fmt(lines[p.id])}</span><span>${p.unit === "lb" ? "lb " : ""}${esc(p.name)}</span></div>`).join("")}</div>`;
}
function usualProducts(cid){
  const used = new Set();
  Object.values(S.orders).forEach(o => { if (o.customerId === cid) Object.entries(orderLines(o)).forEach(([k,v]) => { if (v > 0) used.add(k); }); });
  Object.entries(getLines(orderId(WEEK, cid))).forEach(([k,v]) => { if (v > 0) used.add(k); });
  return used;
}

/* ---------- Calls: one customer at a time ---------- */
let CALL = {cid: null, after: null};
function callQueue(){
  const today = DAYS[new Date().getDay()];
  const rank = cu => { const o = S.orders[orderId(WEEK, cu.id)], st = (o && o.status) || "todo";
    return (st === "ordered" || st === "none") ? 3 : st === "callback" ? 1 : cu.callDay === today ? 0 : 2; };
  return activeCustomers().sort((a,b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
}
function isDone(cid){ const o = S.orders[orderId(WEEK, cid)]; return !!o && (o.status === "ordered" || o.status === "none"); }
function renderCalls(){
  const el = $("#v-calls"), q = callQueue(), doneN = q.filter(c => isDone(c.id)).length;
  if (!q.length){ el.innerHTML = `<div class="empty">No customers yet.</div>`; return; }
  if (!CALL.cid || !S.customers[CALL.cid]) CALL.cid = (q.find(c => !isDone(c.id)) || q[0]).id;
  const cu = Object.assign({id: CALL.cid}, S.customers[CALL.cid]), oid = orderId(WEEK, cu.id), o = S.orders[oid], st = (o && o.status) || "todo";
  const d = parseD(WEEK); d.setDate(d.getDate()-7); const prev = S.orders[orderId(isoD(d), cu.id)];
  const prevLines = prev ? orderLines(prev) : {}; const hasPrev = Object.values(prevLines).some(v => v > 0);
  const phone = (contactsOf(cu).find(k => k.phone) || {}).phone;
  const nextUp = q.find(c => c.id !== cu.id && !isDone(c.id));
  let body;
  if (CALL.after === cu.id){
    body = `<p style="font-size:1.1rem;margin:.75rem 0 0">${st === "none" ? "Saved. No order this week." : st === "callback" ? "Saved. Marked to call back." : "Saved. Read this back to them:"}</p>
      ${st === "ordered" ? readback(getLines(oid)) : ""}
      ${st === "ordered" ? `<button class="bigbtn alt" data-act="change">Fix something</button>` : ""}
      ${nextUp ? `<button class="bigbtn" data-next="${nextUp.id}">Next: ${esc(nextUp.name)}</button>` : `<p class="note" style="margin-top:1rem">That's everyone for this week.</p>`}`;
  } else {
    body = `${cu.notes ? `<div class="pin">${esc(cu.notes)}</div>` : ""}
      ${(() => { const lt = lastTouch(cu.id); return lt ? `<div class="lastc">Last contact ${ago(lt.at)}: ${esc(lt.summary)}</div>` : ""; })()}
      ${phone ? `<a class="bigbtn tel" href="tel:${esc(phone)}">Call ${esc(phone)}</a>` : ""}
      ${st === "ordered" ? `<p style="margin:.75rem 0 0">Already ordered this week:</p>${readback(getLines(oid))}` : hasPrev ? `<p style="margin:.75rem 0 0">Last week they ordered:</p>${readback(prevLines)}` : `<p class="muted">No order last week.</p>`}
      ${hasPrev && st !== "ordered" ? `<button class="bigbtn" data-act="same">Same as last week</button>` : ""}
      <button class="bigbtn ${hasPrev && st !== "ordered" ? "alt" : ""}" data-act="change">${st === "ordered" ? "Change the order" : hasPrev ? "Different order this week" : "Enter their order"}</button>
      <button class="bigbtn quiet" data-act="none">No order this week</button>
      <button class="bigbtn quiet" data-act="callback">Call back later</button>
      ${st === "callback" && o && o.notes ? `<p class="small muted">${esc(o.notes)}</p>` : ""}`;
  }
  el.innerHTML = `<div class="callprog"><h2>Calls</h2><span class="muted">${doneN} of ${q.length} done</span></div>
    <div class="callcard"><div class="row"><h2 style="flex:1">${esc(cu.name)}</h2><span class="st ${st}">${STATUS[st]}</span></div>${body}</div>
    <div class="queue"><h3 style="margin-bottom:.25rem">Everyone this week</h3>${q.map(c => { const oo = S.orders[orderId(WEEK, c.id)], s2 = (oo && oo.status) || "todo";
      return `<button data-pick="${c.id}" aria-current="${c.id === cu.id}"><span>${esc(c.name)}</span><span class="st ${s2}">${STATUS[s2]}</span></button>`; }).join("")}</div>`;
  const snap = () => { const cur = S.orders[oid]; return cur ? JSON.parse(JSON.stringify(cur)) : null; };
  const undoTo = before => () => { if (before) Store.set("orders", oid, before); else Store.remove("orders", oid); CALL.after = null; render(); };
  el.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const a = b.dataset.act, before = snap();
    if (a === "same"){ drafts[oid] = Object.assign({}, prevLines); flushOrder(cu.id, {status: "ordered"}); CALL.after = cu.id; toast("Copied last week's order", undoTo(before)); }
    else if (a === "change"){ CALL.after = null; openOrderSheet(cu.id); SHEET.fromCalls = true; }
    else if (a === "none"){ flushOrder(cu.id, {status: "none", lines: {}}); drafts[oid] = undefined; delete drafts[oid]; CALL.after = cu.id; toast("No order this week", undoTo(before)); }
    else if (a === "callback"){ askCallback(cu.id, before, undoTo); return; }
    render(); window.scrollTo(0,0);
  });
  el.querySelectorAll("[data-next],[data-pick]").forEach(b => b.onclick = () => { CALL.cid = b.dataset.next || b.dataset.pick; CALL.after = null; render(); window.scrollTo(0,0); });
}
function askCallback(cid, before, undoTo){
  openSheet(`<div class="hd"><h3>Call back later</h3><button class="iconbtn" data-close aria-label="Close">&#10005;</button></div>
    <label class="lbl" for="cbn" style="font-size:1rem">When should you call back? (optional)</label><input id="cbn" class="field" placeholder="Wednesday after 10">
    <button class="bigbtn" id="cbs">Save</button>`);
  $("#cbs").onclick = () => { flushOrder(cid, {status: "callback", notes: $("#cbn").value.trim()}); closeSheet(); CALL.after = cid; toast("Marked to call back", undoTo(before)); render(); };
}

/* ---------- Packing ---------- */
let PACKFILTER = "todo";
function packStats(wk){
  let total = 0, done = 0;
  weekOrders(wk).forEach(o => { const pk = S.packing[o.id] || {}; const items = pk.items || {};
    Object.entries(orderLines(o)).forEach(([pid, q]) => { if (q > 0){ total++; if (n(items[pid]) >= q) done++; } }); });
  return {total, done};
}
function renderPack(){
  const el = $("#v-pack"), orders = weekOrders(WEEK).filter(o => Object.values(orderLines(o)).some(v => v > 0));
  const st = packStats(WEEK);
  const byIds = [...new Set(orders.map(o => (S.packing[o.id]||{}).by).filter(Boolean))]; resolveNames(byIds.filter(id => !(id in NAMES)));
  orders.sort((a,b) => ((S.customers[a.customerId]||{}).name||"").localeCompare((S.customers[b.customerId]||{}).name||""));
  const shown = orders.filter(o => { const pk = S.packing[o.id] || {}; const items = pk.items || {}; const allDone = Object.entries(orderLines(o)).every(([pid,q]) => !(q>0) || n(items[pid]) >= q);
    return PACKFILTER === "all" || (PACKFILTER === "todo" ? !allDone : allDone); });
  el.innerHTML = `
  <div class="packhead"><div><h2>Packing</h2><span class="muted">${st.done} of ${st.total} lines packed</span> <button class="copy noprint" id="printPack">Print a paper copy</button></div>
    <div class="seg" role="group" aria-label="Show">${[["todo","To pack"],["done","Done"],["all","All"]].map(([k,v]) => `<button data-f="${k}" aria-pressed="${PACKFILTER===k}">${v}</button>`).join("")}</div></div>
  <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${st.total}" aria-valuenow="${st.done}"><i style="width:${st.total ? st.done/st.total*100 : 0}%"></i></div>
  ${!orders.length ? `<div class="empty">No orders for this week yet. They show up here as soon as they're entered.</div>` :
    !shown.length ? `<div class="empty">${PACKFILTER === "todo" ? "Everything is packed." : "Nothing here yet."}</div>` :
    shown.map(o => { const cu = S.customers[o.customerId] || {name: o.customerId}, pk = S.packing[o.id] || {}, items = pk.items || {};
      const lines = Object.entries(orderLines(o)).filter(([,q]) => q > 0);
      const nDone = lines.filter(([pid,q]) => n(items[pid]) >= q).length;
      return `<div class="pcust"><div class="ph"><b>${esc(cu.name)}</b><span class="small num">${nDone}/${lines.length}</span></div>
        ${lines.map(([pid,q]) => { const p = prodById(pid) || {name: pid, unit: ""}, got = n(items[pid]), cls = got >= q ? "done" : got > 0 ? "part" : "";
          return `<button class="prow ${cls}" data-t="${o.id}|${pid}" aria-pressed="${got >= q}"><span class="box" aria-hidden="true">${got >= q ? "&#10003;" : got > 0 ? "!" : ""}</span>
            <span class="what"><b>${esc(p.name)}</b><br><span class="small muted">${p.unit === "lb" ? "Pounds. " : ""}${got > 0 && got < q ? `Packed ${fmt(got)}, short ${fmt(q-got)}` : got > q ? `Packed ${fmt(got)}, over ${fmt(got-q)}` : got >= q ? "Packed" : "Tap when packed"}</span></span>
            <span class="qty num">${fmt(q)}</span></button>${got >= q || got > 0 ? `<button class="fewer" data-adj="${o.id}|${pid}">${got > 0 && got < q ? "Change the count" : "Packed a different amount?"}</button>` : ""}`; }).join("")}
        ${nDone === lines.length ? `<div class="alldone">All packed. Add boxes and pallet below.</div>` : ""}
        <div class="pfoot"><span class="small">Boxes</span><div class="stepper"><button data-bx="${o.id}|-1" aria-label="One less box">&minus;</button><input data-k="bx:${o.id}" data-bxi="${o.id}" inputmode="numeric" value="${pk.boxes || ""}" aria-label="Boxes"><button data-bx="${o.id}|1" aria-label="One more box">+</button></div>
          <label class="small" for="pl-${o.id}">Pallet</label><input id="pl-${o.id}" class="field" style="width:5rem" data-k="pl:${o.id}" data-pl="${o.id}" value="${esc(pk.pallet || "")}">
          <span class="spacer"></span>${pk.by || pk.at ? `<span class="by">${pk.by ? esc(NAMES[pk.by] || "Someone") : ""}${pk.at ? " at " + new Date(pk.at).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : ""}</span>` : ""}</div></div>`; }).join("")}`;
  el.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { PACKFILTER = b.dataset.f; render(); });
  el.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { const [oid, pid] = b.dataset.t.split("|"); const q = n(orderLines(S.orders[oid])[pid]); const got = n(((S.packing[oid]||{}).items||{})[pid]);
    const nm = (prodById(pid) || {name: pid}).name; savePack(oid, pid, got >= q ? 0 : q); toast(got >= q ? nm + " unchecked" : nm + " packed", () => savePack(oid, pid, got)); });
  const pp = $("#printPack"); if (pp) pp.onclick = printPacking;
  el.querySelectorAll("[data-adj]").forEach(b => b.onclick = () => { const [oid, pid] = b.dataset.adj.split("|"); adjustPacked(oid, pid); });
  el.querySelectorAll("[data-bx]").forEach(b => b.onclick = () => { const [oid, d] = b.dataset.bx.split("|"); const cur = n((S.packing[oid]||{}).boxes); savePackMeta(oid, {boxes: Math.max(0, cur + n(d))}); });
  el.querySelectorAll("[data-bxi]").forEach(i => i.onchange = () => savePackMeta(i.dataset.bxi, {boxes: Math.max(0, Math.round(n(i.value)))}));
  el.querySelectorAll("[data-pl]").forEach(i => i.onchange = () => savePackMeta(i.dataset.pl, {pallet: i.value.trim()}));
}
function printPacking(){
  const orders = weekOrders(WEEK).filter(o => Object.values(orderLines(o)).some(v => v > 0)).sort((a,b) => ((S.customers[a.customerId]||{}).name||"").localeCompare((S.customers[b.customerId]||{}).name||""));
  $("#printArea").innerHTML = `<h1>Packing list, week of ${niceD(WEEK)}</h1>` + orders.map(o => { const cu = S.customers[o.customerId] || {name: o.customerId};

function openHW(id){

      while (cur.length < slots) cur.push(opts[0] ? opts[0].id : ""); draft.choices[pt.id] = cur; }); };
  const draw = () => { fill(); const RUN = {}; const oh = freezerOnHand(); const lines = hwLines(draft); const frac = draft.size === "whole" ? 1 : 0.5;
    // availability counts other pending orders too
    const otherNeed = {}; Object.entries(S.halfwhole).forEach(([k,h]) => { if (k !== hid && h.status === "pending"){ const l = hwLines(h); for (const x in l) otherNeed[x] = (otherNeed[x]||0) + l[x]; } });

      <div class="coach">${coachParts().map(pt => { const opts = optionsFor(pt.id);
        return `<div class="part"><b>${esc(pt.name)}</b> <span class="small muted">${draft.choices[pt.id].length} in a ${draft.size}</span>
          ${draft.choices[pt.id].map((v, i) => { const free = (oh[v]||0) - (otherNeed[v]||0); RUN[v] = (RUN[v]||0) + 1; const usedHere = RUN[v];
            return `<div class="slot"><span>${esc(pt.name)} ${draft.choices[pt.id].length > 1 ? i+1 : ""}</span><select class="field" data-ch="${pt.id}|${i}" aria-label="${esc(pt.name)} ${i+1}">${opts.map(o => `<option value="${o.id}" ${o.id===v?"selected":""}>${esc(o.name)}</option>`).join("")}</select>
              <span class="avail ${free >= usedHere ? "ok" : "no"}">${free >= usedHere ? "In freezer" : "Cut fresh"}</span></div>`; }).join("")}</div>`; }).join("")}
        ${parts().filter(p => !p.check).map(pt => `<div class="part small muted">Plus about ${fmt(pt.yield * frac)} lb ground lamb from the trim.</div>`).join("")}
      </div>

      <div style="flex:1 1 150px"><label class="lbl" for="hs">Status</label><select id="hs" class="field">${[["pending","Pending"],["filled","Filled"],["cancelled","Cancelled"]].map(([k,v]) => `<option value="${k}" ${draft.status===k?"selected":""}>${v}</option>`).join("")}</select></div></div>
      <label class="lbl" for="hno">Notes from the call</label><textarea id="hno" class="field" rows="2">${esc(draft.notes)}</textarea>
      <div class="row" style="margin-top:1rem">${id ? `<button class="btn danger small" id="hdel">Delete</button>` : ""}<span class="spacer"></span><button class="btn ghost" data-close>Cancel</button><button class="btn" id="hsave">Save order</button></div>`;
    const box = $("#sheetBox");
    box.querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheet);

    box.querySelectorAll("[data-sz]").forEach(b => b.onclick = () => { grab(); draft.size = b.dataset.sz; draw(); });

    const del = $("#hdel"); if (del) del.onclick = () => { if (confirm("Delete this order?")){ Store.remove("halfwhole", hid); closeSheet(); } };
  };

      <input class="field" data-ck="${i}|phone" inputmode="tel" placeholder="Phone" value="${esc(k.phone)}"><input class="field" data-ck="${i}|email" inputmode="email" placeholder="Email" value="${esc(k.email)}">
      <button class="copy" data-crm="${i}">Remove</button></div>`).join("")}
    <button class="btn ghost small" id="cadd" style="margin-top:.5rem">Add another person</button>
    <label class="row small" style="margin-top:.8rem"><input type="checkbox" id="ca" ${c.active !== false ? "checked" : ""}> Active (shows on the weekly order list)</label>
    <div class="row" style="margin-top:1rem"><span class="spacer"></span><button class="btn ghost" data-close>Cancel</button><button class="btn" id="csave">Save</button></div>`);
    const box = $("#sheetBox");
    const grab = () => { c.name = $("#cn").value; c.type = $("#ct").value; c.callDay = $("#cd").value; c.active = $("#ca").checked;
      box.querySelectorAll("[data-ck]").forEach(i => { const [ix, f] = i.dataset.ck.split("|"); contacts[+ix][f] = i.value.trim(); }); };
    $("#cadd").onclick = () => { grab(); contacts.push({name:"", role:"", phone:"", email:""}); draw(); };
    box.querySelectorAll("[data-crm]").forEach(b => b.onclick = () => { grab(); contacts.splice(+b.dataset.crm, 1); draw(); });
    $("#csave").onclick = () => { grab(); const name = c.name.trim(); if (!name){ toast("Add a name"); return; }
      const kept = contacts.filter(k => k.name || k.phone || k.email);
      const cid = id || name.toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40) + "-" + uid().slice(-4);
      const prev = id ? S.customers[id] : {};
      Store.set("customers", cid, Object.assign({}, prev, {name, type: c.type, callDay: c.callDay, active: c.active, notes: prev.notes || c.notes || "", contacts: kept, contact: (kept[0]||{}).name || "", phone: (kept[0]||{}).phone || ""}));
      toast("Customer saved"); openCustSheet(cid); };
  };
  draw();
}

/* ---------- Setup ---------- */
function renderSetup(){
  const el = $("#v-setup"), c = cfg();
  el.innerHTML = `<h2 style="margin-bottom:.5rem">Setup</h2>
  <p class="note small">Numbers highlighted in yellow are starting guesses. Kathy can correct them here and every calculation updates.</p>
  <div class="grid2"><div class="panel"><h3>What one lamb gives you</h3><table class="simple"><thead><tr><th>Part</th><th>Per lamb</th><th>Where it came from</th></tr></thead><tbody>
  ${c.parts.map((p,i) => `<tr><td><b>${esc(p.name)}</b> <span class="small muted">${esc(p.unit)}</span></td><td><input class="field num ${p.confirmed ? "" : "unconfirmed"}" style="width:5.5rem" data-k="y:${p.id}" data-yi="${i}" inputmode="decimal" value="${fmt(p.yield)}"></td>
    <td class="small">${esc(p.source||"")}${p.confirmed ? "" : ` <button class="copy" data-conf="${i}">Mark confirmed</button>`}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="panel"><h3>Products and the parts they use</h3><table class="simple"><tbody>
  ${c.products.map(p => `<tr><td><b>${esc(p.name)}</b><br><span class="small muted">${esc(p.unit)}${p.note ? ". " + esc(p.note) : ""}</span></td><td class="small">${p.uses.map(u => `${fmt(u.qty)} ${esc((partById(u.part)||{}).name||u.part)}`).join(" + ")}</td></tr>`).join("")}
  </tbody></table><p class="small muted">Adding and renaming products comes in the full version.</p></div></div>
  <div class="panel" style="margin-top:1rem;max-width:640px"><h3>Processor</h3>
    <div class="row"><div style="flex:1 1 160px"><label class="lbl" for="pname">Name</label><input id="pname" class="field" value="${esc(proc().name)}"></div>
    <div style="flex:2 1 220px"><label class="lbl" for="pemail">Email for cut sheets</label><input id="pemail" class="field" inputmode="email" value="${esc(proc().email)}" placeholder="Ask Denise who should get these"></div></div>
    <label class="lbl" for="pstand">Instructions that go on every cut sheet</label><textarea id="pstand" class="field" rows="3" placeholder="One per line. Packaging, labels, anything they should always do">${esc(proc().standing)}</textarea></div>`;
  el.querySelectorAll("[data-yi]").forEach(i => i.onchange = () => { const nc = JSON.parse(JSON.stringify(cfg())); nc.parts[+i.dataset.yi].yield = Math.max(0, n(i.value)); Store.set("config", "setup", nc); toast("Saved"); });
  el.querySelectorAll("[data-conf]").forEach(b => b.onclick = () => { const nc = JSON.parse(JSON.stringify(cfg())); nc.parts[+b.dataset.conf].confirmed = true; Store.set("config", "setup", nc); });
  const saveProc = () => { const nc = JSON.parse(JSON.stringify(cfg())); nc.processor = {name: $("#pname").value.trim() || "Mohawk", email: $("#pemail").value.trim(), standing: $("#pstand").value.trim()}; Store.set("config", "setup", nc); toast("Saved"); };
  ["#pname","#pemail","#pstand"].forEach(id => $(id).onchange = saveProc);
}

let startView = "week"; try { startView = localStorage.getItem("uvl:view") || (ROLES[ROLE] ? ROLES[ROLE].home : "week"); } catch(e){}
applyRole();
go(ROLE ? startView : "welcome");
Store.init();
})();
</script>
